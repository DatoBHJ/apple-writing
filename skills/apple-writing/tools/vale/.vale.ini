# Vale configuration for the apple-writing skill.
#   vale --config=tools/vale/.vale.ini path/to/text.md
#
# Vale is not required — tools/check-apple-style.py covers the mechanical layer
# with no dependencies. Use this when a team already runs Vale in CI.

StylesPath = styles
MinAlertLevel = warning

[*.{md,mdx,txt,html,json,yaml,yml}]
BasedOnStyles = apple-writing

# The policy register: "we" is the company speaking as itself, so first person is
# correct there. Privacy notices, terms and leadership letters live here.
[**/policy/**/*.{md,txt}]
apple-writing.FirstPerson = NO

# Marketing copy: exclamation marks are permitted "occasionally in promotional
# text" by Apple's own guide (Apple still ships none, so we keep it as a warning
# rather than switching it off).
[**/marketing/**/*.{md,txt}]
apple-writing.Exclamation = NO
